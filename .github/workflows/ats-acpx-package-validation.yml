name: ATS ACPX Package Validation

# Isolated npm package reconstruction; never pushes, merges or invokes AI providers.
on:
  push:
    branches:
      - ats/upstream-2026-1117-integration
    paths:
      - .github/workflows/ats-acpx-package-validation.yml
      - .github/scripts/ats-acpx-package-reconcile.py
      - .github/scripts/ats-acpx-package-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Merge ACPX package sources and prove process-group safety
        shell: bash
        env:
          ATS_SHA: 96a712e1968be89701ec7fc9f5ae452dce081914
          UPSTREAM_SHA: c0f132898d2a2677312d8c72096187b27a3d9a38
        run: |
          set -euo pipefail
          root="$PWD"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git cat-file -e "$ATS_SHA:patches/acpx@0.13.1.patch"
          work="$(mktemp -d)"
          git show "$ATS_SHA:patches/acpx@0.13.1.patch" > "$work/ats.patch"
          cp patches/acpx@0.13.1.patch "$work/upstream.patch"
          (cd "$work" && npm pack acpx@0.13.1 --ignore-scripts --silent)
          mkdir -p "$work/original" "$work/repo" "$work/verify"
          tar -xzf "$work"/acpx-0.13.1.tgz -C "$work/original"
          cp -a "$work/original/package/." "$work/repo/"
          cd "$work/repo"
          git init -q -b base
          git config user.name "ATS source merger"
          git config user.email "ats-acpx-merge@users.noreply.github.com"
          git add -A && git commit -qm 'acpx@0.13.1 npm base'
          base="$(git rev-parse HEAD)"
          git branch ats
          git switch -qc upstream
          git apply --check "$work/upstream.patch"
          git apply "$work/upstream.patch"
          git add -A && git commit -qm 'Upstream stable ACPX patch'
          git switch -q ats
          git apply --check "$work/ats.patch"
          git apply "$work/ats.patch"
          git add -A && git commit -qm 'ATS ACPX process group patch'
          git switch -q upstream
          set +e
          git merge --no-commit --no-ff ats > "$work/merge.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ -z "$(git ls-files -u)" ]; then
            cat "$work/merge.log"
            echo "::error::ACPX merge failed without recognised conflicts"
            exit "$rc"
          fi
          python3 "$root/.github/scripts/ats-acpx-package-reconcile.py"
          git diff "$base" -- dist/ > "$work/combined.patch"
          test -s "$work/combined.patch"
          echo "Combined patch bytes $(wc -c < "$work/combined.patch")"
          echo "Combined patch SHA256 $(sha256sum "$work/combined.patch")"
          echo "Combined modified paths:"
          git diff --name-only "$base" -- dist/
          cp -a "$work/original/package/." "$work/verify/"
          cd "$work/verify"
          git apply --check "$work/combined.patch"
          git apply "$work/combined.patch"
          for file in dist/live-checkpoint-BSIrfgVo.js dist/runtime.js dist/owned-process-group.js; do
            node --check "$file"
          done
          diff -qr "$work/repo/dist" "$work/verify/dist"
          ACPX_PATCHED_ROOT="$work/verify" node --test "$root/.github/scripts/ats-acpx-package-smoke.mjs"
          echo "ACPX VALIDATION PASS: source merge, regenerated patch, Node syntax, package reproducibility and process-group smoke"
          echo "### ACPX v0.13.1 combined patch validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Both original patches independently applied to the original npm tarball." >> "$GITHUB_STEP_SUMMARY"
          echo "- Six source-level conflicts resolved with exact-shape checks." >> "$GITHUB_STEP_SUMMARY"
          echo "- Reconstructed patch applies, Node syntax checks and descendant-shutdown smoke pass." >> "$GITHUB_STEP_SUMMARY"
          echo "- Patch SHA-256: $(sha256sum "$work/combined.patch" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- No production or branch mutations." >> "$GITHUB_STEP_SUMMARY"
          echo "ATS_ACPX_PATCH_BASE64_BEGIN"
          base64 -w 0 "$work/combined.patch" | fold -w 3000
          echo "ATS_ACPX_PATCH_BASE64_END"
