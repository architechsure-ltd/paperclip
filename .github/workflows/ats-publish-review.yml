name: ATS Publish One-Time Upstream Review Candidate
# Single purpose: publish a merged review branch, never master or production.
on:
  push:
    branches:
      - ats/upstream-2026-1117-integration
    paths:
      - .github/workflows/ats-publish-review.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned integration candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact merged source only to reserved review branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATS_MASTER: 96a712e1968be89701ec7fc9f5ae452dce081914
          UPSTREAM_STABLE: c0f132898d2a2677312d8c72096187b27a3d9a38
          EXPECTED_REVIEW_HEAD: 3df5fd25a0a79b68de523fced3f0078b6f2d9a45
          REVIEW: ats/upstream-2026-1117-review
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "architechsure-ltd/paperclip"
          test "$GITHUB_REF" = "refs/heads/ats/upstream-2026-1117-integration"
          test "$GITHUB_EVENT_NAME" = "push"
          git merge-base --is-ancestor "$UPSTREAM_STABLE" HEAD
          live_master=$(git ls-remote --heads origin refs/heads/master | cut -f1)
          test "$live_master" = "$ATS_MASTER"
          review_head=$(git ls-remote --heads origin "refs/heads/$REVIEW" | cut -f1)
          test "$review_head" = "$EXPECTED_REVIEW_HEAD"
          git config user.name "ATS one-time review integration"
          git config user.email "ats-upstream-review@users.noreply.github.com"
          git fetch --no-tags origin "$ATS_MASTER"
          set +e
          git merge --no-ff --no-commit "$ATS_MASTER" > /tmp/ats-review-merge.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            test -n "$(git ls-files -u)"
            python3 .github/scripts/ats-reconcile-upstream.py
          fi
          test -z "$(git ls-files -u)"
          # Do not publish this temporary write-permission workflow to the PR.
          git rm -- .github/workflows/ats-publish-review.yml
          if grep -R -nE '^  schedule:' .github/workflows; then
            echo "::error::Scheduled workflow unexpectedly present"
            exit 1
          fi
          test ! -f .github/workflows/refresh-lockfile.yml
          echo "a861fc566594fdfa90311efde61737e3c37ea3403cb5e52234c25bcf9a99d107  patches/acpx@0.13.1.patch" | sha256sum -c -
          git diff --cached --check
          git commit --no-gpg-sign -m "chore(ats): prepare upstream 2026.1117.0 merged review candidate"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          # No force push. Review ref must fast-forward from the pinned base.
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$REVIEW"
          echo "### ATS one-time review branch publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review branch: $REVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ATS master unchanged: $ATS_MASTER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Draft PR, testing, staging and deployment remain separate approval gates." >> "$GITHUB_STEP_SUMMARY"
