name: ATS PR15 ACPX cold-resume fix rehearsal

# Test-only correction of the ATS ACPX patch in a temporary checkout; no provider or remote repository mutation.
on:
  push:
    branches:
      - ats/upstream-2026-1117-integration
    paths:
      - .github/workflows/ats-pr15-acpx-cold-resume-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-resume:
    name: Claude resume + owned process lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: ATS-PR15
            repository: architechsure-ltd/paperclip
            sha: 3b03d92b20460c961a798c1ce0b69352108f53fe
    env:
      OPENAI_BASE_URL: http://127.0.0.1:9
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      GOOGLE_GENERATIVE_AI_BASE_URL: http://127.0.0.1:9
      PAPERCLIP_TEST_POSTGRES_TEMPLATE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # node 24
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Remove erroneous ATS resume-only config replay condition (temporary checkout)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/acpx@0.13.1.patch')
          s = p.read_text()
          start_hunk = '@@ -6219,7 +6553,7 @@ async function replayFreshSessionPreferences(params) {'
          next_hunk = '@@ -6435,6 +6769,27 @@ async function withConnectedSession(options) {'
          assert s.count(start_hunk) == 1 and s.count(next_hunk) == 1
          start = s.index(start_hunk)
          end = s.index(next_hunk, start)
          hunk = s[start:end]
          assert '-\t\tconfigReplay = await replayDesiredConfigOptions({' in hunk
          assert '+\t\tif (params.createdFreshSession) configReplay = await replayDesiredConfigOptions({' in hunk
          assert hunk.startswith(start_hunk) and hunk.count('configReplay = await replayDesiredConfigOptions({') == 2
          p.write_text(s[:start] + s[end:])
          print('Removed ATS-only conditional replay hunk; upstream original unconditional config restoration preserved')
          PY
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          git diff -- pnpm-lock.yaml | tail -n 65
      - name: Frozen install and workspace prerequisites
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Expose mock-peer failure status and wire sequence (temporary checkout only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/paperclip-runner/src/drivers/acpx/claude-effort.test.ts')
          s = p.read_text()
          old = '    expect(result.status).toBe("completed");'
          assert s.count(old) == 1
          log = '    console.log("ATS_COLD_RESUME_DIAGNOSTIC", JSON.stringify({result, wire}));'
          p.write_text(s.replace(old, log + chr(10) + old))
          PY
      - name: Verify whole Claude effort admission suite and provider-free cold resume
        run: |
          set -euo pipefail
          pnpm --filter @paperclipai/paperclip-runner exec vitest run src/drivers/acpx/claude-effort.test.ts --maxWorkers=1
      - name: Verify ATS ACPX owned-process and descendant shutdown regressions
        run: |
          node --import ./server/node_modules/tsx/dist/loader.mjs --test server/src/__tests__/acpx-owned-process-lifecycle.test.mjs
