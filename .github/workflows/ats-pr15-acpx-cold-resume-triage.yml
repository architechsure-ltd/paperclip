name: ATS PR15 fork CI and lock proof acceptance

# Verify the committed PR15 correction from a read-only checkout; no provider, merge or deployment.
on:
  push:
    branches:
      - ats/upstream-2026-1117-integration
    paths:
      - .github/workflows/ats-pr15-acpx-cold-resume-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-resume:
    name: Claude resume + owned process lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: ATS-PR15
            repository: architechsure-ltd/paperclip
            sha: 04d8ba8999057ee68ede77423662e1a9d5ed60c4
    env:
      OPENAI_BASE_URL: http://127.0.0.1:9
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      GOOGLE_GENERATIVE_AI_BASE_URL: http://127.0.0.1:9
      PAPERCLIP_TEST_POSTGRES_TEMPLATE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # node 24
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Frozen install and workspace prerequisites
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Verify offline lockfile proof and ATS no-schedule workflow tests
        run: |
          set -euo pipefail
          node tests/runner-e2e/prepare-report-lock.mjs
          pnpm test:e2e:runner:unit prepare-report-lock.test.ts workflow-security.test.ts --maxWorkers=1
          node --test tests/runner-e2e/reliability-testops.test.mjs .github/scripts/tests/ci-plan.test.mjs
      - name: Verify whole Claude effort admission suite and provider-free cold resume
        run: |
          set -euo pipefail
          pnpm --filter @paperclipai/paperclip-runner exec vitest run src/drivers/acpx/claude-effort.test.ts --maxWorkers=1
      - name: Verify ATS ACPX owned-process and descendant shutdown regressions
        run: |
          node --import ./server/node_modules/tsx/dist/loader.mjs --test server/src/__tests__/acpx-owned-process-lifecycle.test.mjs
